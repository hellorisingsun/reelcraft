<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ReelCraft" />
  <meta name="theme-color" content="#0b0d12" />
  <title>ReelCraft Studio — Auto Photo-to-Reel & Short Maker</title>
  <link id="appManifestLink" rel="manifest" />
  <link id="appleTouchIcon" rel="apple-touch-icon" />
  <style>
    :root {
      --bg-app: #0b0d12;
      --bg-panel: #131722;
      --bg-card: #1b2030;
      --bg-card-hover: #242b40;
      --border: #2a324a;
      --text-main: #f3f5fa;
      --text-muted: #949eb8;
      --accent: #7c5cff;
      --accent-hover: #6a48f5;
      --accent-glow: rgba(124, 92, 255, 0.35);
      --pink: #ff4d8d;
      --teal: #14d8b4;
      --amber: #ffb020;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-app);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.95rem;
      letter-spacing: -0.02em;
      min-width: 0;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), var(--pink));
      display: grid;
      place-items: center;
      box-shadow: 0 4px 14px var(--accent-glow);
      flex-shrink: 0;
    }

    .brand-text-stack {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.1;
      white-space: nowrap;
    }

    .brand-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .brand-badge {
      font-size: 8px !important;
      font-weight: 700;
      padding: 1px 5px !important;
      line-height: 1.1 !important;
      margin-top: 2px;
      border-radius: 999px;
      background: rgba(20, 216, 180, 0.14);
      color: var(--teal);
      border: 1px solid rgba(20, 216, 180, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: inline-block;
      cursor: pointer;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.16s ease;
      user-select: none;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:hover {
      background: var(--bg-card-hover);
      border-color: #3d4869;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9b4dff);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn-primary:hover {
      filter: brightness(1.08);
      background: linear-gradient(135deg, var(--accent), #9b4dff);
    }

    .btn-export {
      background: linear-gradient(135deg, #ff4d8d, #ff7b39);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 77, 141, 0.35);
    }

    .btn-export:hover {
      filter: brightness(1.08);
    }

    .btn-sm {
      padding: 6px 9px;
      font-size: 0.74rem;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Main Workspace Grid */
    .workspace {
      display: grid;
      grid-template-columns: minmax(310px, 430px) 1fr;
      height: calc(100dvh - 52px);
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .workspace {
        display: flex;
        flex-direction: column;
        height: calc(100dvh - 50px);
        overflow: hidden;
      }
    }

    /* Left Preview Column */
    .preview-stage {
      background: radial-gradient(circle at 50% 25%, #191f33 0%, #0b0d12 75%);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 12px;
      position: relative;
      flex-shrink: 0;
    }

    @media (max-width: 900px) {
      .preview-stage {
        border-right: none;
        border-bottom: 1px solid var(--border);
        padding: 8px 12px 10px;
        gap: 8px;
        z-index: 25;
      }
    }

    .canvas-shell {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
      max-width: 100%;
    }

    canvas#previewCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas#previewCanvas:active {
      cursor: grabbing;
    }

    .canvas-hint {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(11, 13, 18, 0.72);
      backdrop-filter: blur(6px);
      color: #e2e8f0;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 999px;
      pointer-events: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      white-space: nowrap;
    }

    /* Transport / Scrubber */
    .transport {
      width: 100%;
      max-width: 340px;
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .transport-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .play-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 3px 10px var(--accent-glow);
    }

    .play-btn:hover {
      background: var(--accent-hover);
    }

    .scrubber {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 6px;
      border-radius: 999px;
      background: #272f47;
      outline: none;
      cursor: pointer;
    }

    .scrubber::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      border: 3px solid var(--accent);
      cursor: pointer;
    }

    .time-readout {
      font-variant-numeric: tabular-nums;
      font-size: 0.76rem;
      color: var(--text-muted);
      min-width: 72px;
      text-align: right;
    }

    .ratio-pills {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .ratio-pill {
      flex: 1;
      padding: 5px 8px;
      border-radius: 7px;
      font-size: 0.73rem;
      font-weight: 600;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      text-align: center;
    }

    .ratio-pill.active {
      background: rgba(124, 92, 255, 0.18);
      border-color: var(--accent);
      color: #fff;
    }

    /* Right Editor Controls */
    .editor-pane {
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      min-width: 0;
      min-height: 0;
      flex: 1;
      overflow: hidden;
    }

    .tabs-nav {
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      background: #0f131d;
      padding: 6px 10px 0;
      gap: 4px;
      scrollbar-width: none;
      flex-shrink: 0;
    }

    .tabs-nav::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      transition: color 0.15s;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      color: #fff;
      border-bottom-color: var(--accent);
    }

    .tab-body {
      padding: 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-bottom: 44px;
    }

    .tab-panel {
      display: none;
      flex-direction: column;
      gap: 18px;
    }

    .tab-panel.active {
      display: flex;
    }

    /* Section Cards & Controls */
    .section-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.86rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .section-sub {
      font-size: 0.77rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed #394466;
      border-radius: var(--radius-md);
      padding: 20px 14px;
      text-align: center;
      background: rgba(124, 92, 255, 0.04);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent);
      background: rgba(124, 92, 255, 0.12);
    }

    .visually-hidden-file {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 1px;
      height: 1px;
      opacity: 0.01;
      overflow: hidden;
      z-index: -1;
    }

    /* Photo Strip */
    .photo-strip {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      gap: 10px;
    }

    .photo-item {
      position: relative;
      aspect-ratio: 9 / 14;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #0d1018;
    }

    .photo-item.active-slide {
      border-color: var(--teal);
      box-shadow: 0 0 0 2px rgba(20, 216, 180, 0.25);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
    }

    .photo-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.88));
      display: flex;
      justify-content: space-between;
      padding: 14px 4px 4px;
      gap: 2px;
    }

    .mini-icon-btn {
      background: rgba(255, 255, 255, 0.16);
      border: none;
      color: #fff;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 0.72rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .mini-icon-btn:hover {
      background: var(--accent);
    }

    .mini-icon-btn.del:hover {
      background: #e11d48;
    }

    /* Option Grids */
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
      gap: 10px;
    }

    .choice-card {
      background: #141825;
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 11px;
      cursor: pointer;
      text-align: left;
      color: var(--text-main);
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .choice-card:hover {
      border-color: #485680;
      background: #191f30;
